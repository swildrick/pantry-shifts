name: Deploy to GitHub Pages

# Builds the app and Storybook on every push to main and publishes them:
#   app       https://<owner>.github.io/<repo>/
#   Storybook https://<owner>.github.io/<repo>/storybook/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the app
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - name: Build Storybook into the site
        run: |
          npm run build-storybook
          cp -r storybook-static dist/storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
